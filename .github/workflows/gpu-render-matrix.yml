name: 'GPU Render Matrix'
on:
  push:
    branches:
    - 'main'
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Highest render path scenario tier to run'
        type: 'choice'
        required: true
        default: 'hybrid'
        options:
        - 'ci'
        - 'gpu'
        - 'hybrid'
concurrency:
  group: 'gpu-render-matrix-${{ github.event_name }}-${{ github.ref == ''refs/heads/main'' && github.run_id || github.ref }}'
  cancel-in-progress: true
jobs:
  render_path_matrix:
    name: 'Render path matrix (Windows x86_64 hybrid GPU (Self-Hosted))'
    runs-on:
    - 'self-hosted'
    - 'Windows'
    - 'X64'
    - 'gpu-hybrid'
    permissions:
      actions: 'write'
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.fsmonitor'
      GIT_CONFIG_VALUE_0: 'false'
    if: '${{ github.repository == ''open-ani/mediamp'' && (!(github.event_name == ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) }}'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@v4'
      with:
        lfs: 'true'
        submodules: 'recursive'
    - id: 'step-1'
      name: 'Setup JBR 21 for other OS'
      uses: 'gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d'
      with:
        java-version: '21'
        distribution: 'jetbrains'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    - id: 'step-2'
      run: 'echo "jvm.toolchain.version=21" >> local.properties'
    - id: 'step-3'
      name: 'Setup Gradle'
      uses: 'gradle/actions/setup-gradle@v3'
      with:
        cache-disabled: 'true'
    - id: 'step-4'
      name: 'Clean and download dependencies'
      uses: 'nick-fields/retry@v2'
      with:
        timeout_minutes: '60'
        max_attempts: '3'
        command: './gradlew "--scan" "--no-configuration-cache" "-Porg.gradle.daemon.idletimeout=60000" "-Pkotlin.native.ignoreDisabledTargets=true" "-Dfile.encoding=UTF-8" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DBoost_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" "-Dorg.gradle.jvmargs=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g" "-Pani.android.abis=x86_64" "-Pmediamp.mpv.test.required=true" "-Pmediamp.ffmpeg.buildvariant=windows" "-Pmediamp.mpv.buildvariant=windows"'
    - id: 'step-5'
      name: 'Render path matrix'
      run: './gradlew --continue "-Pmediamp.mpv.renderpath.tier=${{ inputs.tier || ''hybrid'' }}" "-Pmediamp.mpv.renderpath.strict=true" :mediamp-mpv:renderPathMatrix "--scan" "--no-configuration-cache" "-Porg.gradle.daemon.idletimeout=60000" "-Pkotlin.native.ignoreDisabledTargets=true" "-Dfile.encoding=UTF-8" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DBoost_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" "-Dorg.gradle.jvmargs=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g" "-Pani.android.abis=x86_64" "-Pmediamp.mpv.test.required=true" "-Pmediamp.ffmpeg.buildvariant=windows" "-Pmediamp.mpv.buildvariant=windows"'
    - id: 'step-6'
      name: 'Upload render path matrix'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'render-path-matrix-self-hosted-windows-gpu-hybrid'
        path: 'mediamp-mpv/build/render-path-matrix/'
        if-no-files-found: 'warn'
        overwrite: 'true'
      if: 'always()'
